# TN5: So sánh FP32 vs FP16 trên Colab T4 Tensor Cores
experiment: tn5
description: "Precision acceleration and cosine similarity evaluation"
models: [mobilenet_v3, resnet50, vit_b_16, yolov8n, distilbert, bert_base, mlp]
